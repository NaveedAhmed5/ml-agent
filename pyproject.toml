[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops-agent"
version = "0.1.0"
description = "Production-Ready MLOps AI Agent for automated training, evaluation, tracking, and deployment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MLOps Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # MLOps & Infrastructure
    "dvc>=3.40.0",
    "mlflow>=2.10.0",
    "kubernetes>=28.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    # ML & Data
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    # Agent & LLM
    "google-genai>=0.1.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "training*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N803", "N806", "E402", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pyrefly]
project-includes = ["agent", "api", "training", "tests"]
exclude = [
    "**/.venv/**",
    "**/venv/**",
    "**/node_modules/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.git/**",
    "**/mlruns/**",
    "**/.dvc/**",
    "**/dist/**",
    "**/build/**"
]