apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-api-deployment
  namespace: mlops-prod
  labels:
    app: mlops-api
    tier: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mlops-api
        tier: serving
    spec:
      containers:
        - name: inference-api
          image: mlops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mlops-api-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

